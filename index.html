<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="沈炜丹 · 嵌入式软件 / 测试开发 · 2027 届 · 作品集改版中">
<title>沈炜丹 · 作品集改版中</title>
<style>
  :root{
    --bg:#fbfbf9; --ink:#141414; --muted:#6b6b6b;
    --line:#e5e3dd; --accent:#1f5eff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f0f10; --ink:#f2f2f0; --muted:#9c9c98;
           --line:#2b2b2e; --accent:#7ea2ff; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:grid; place-items:center; padding:32px 24px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  main{width:100%; max-width:520px}

  .status{display:inline-flex; align-items:center; gap:9px; margin:0 0 28px;
          font-size:12.5px; letter-spacing:.1em; color:var(--muted)}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--accent);
       box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent)}

  h1{font-size:clamp(30px,7vw,40px); line-height:1.15; font-weight:700;
     letter-spacing:.02em; margin:0 0 16px}
  .role{margin:0 0 7px; font-size:15.5px}
  .tagline{margin:0 0 30px; font-size:15.5px; color:var(--muted)}

  hr{border:0; border-top:1px solid var(--line); margin:0 0 26px}

  .note{margin:0 0 16px; font-size:14.5px; line-height:1.85; color:var(--muted)}
  .links{display:flex; flex-wrap:wrap; align-items:center; gap:6px 11px; margin:0; font-size:14.5px}
  .links a{color:var(--ink); text-decoration:none; padding-bottom:1px;
           border-bottom:1px solid var(--line);
           transition:color .18s ease, border-color .18s ease}
  .links a:hover,.links a:focus-visible{color:var(--accent); border-color:var(--accent)}
  .sep{color:var(--line)}

  footer{margin-top:46px; font-size:12.5px; letter-spacing:.04em; color:var(--muted)}
</style>
</head>
<body>
<main>
  <p class="status"><span class="dot"></span>作品集改版中</p>

  <h1>沈炜丹</h1>
  <p class="role">嵌入式软件 / 测试开发 · 2027 届</p>
  <p class="tagline">设备侧开发 + 质量保障</p>

  <hr>

  <p class="note">本站正在改版，暂时下线。<br>技术作品可以先看 GitHub：</p>
  <p class="links">
    <a href="https://github.com/swdscsc" target="_blank" rel="noopener">github.com/swdscsc</a>
    <span class="sep">/</span>
    <a href="mailto:3103141093@qq.com">3103141093@qq.com</a>
  </p>

  <footer>深圳 · 可连续实习 6 个月以上</footer>
</main>
</body>
</html>
